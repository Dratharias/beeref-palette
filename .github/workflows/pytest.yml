name: pytest

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # Same headless platform as `make test`; no X server needed
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install . -r requirements/test.txt
          pip install pyQt6==6.7.0 pyQt6-Qt6==6.7.0 --upgrade
      - name: Run Unittests with pytest
        # The two window-move tests need a real window manager
        run: |
          pytest -q \
            --deselect tests/test_view.py::test_mouse_press_move_window \
            --deselect tests/test_view.py::test_mouse_move_movewin
